<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Admission Form</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #eef2f3; display: flex; justify-content: center; padding: 20px; }
        .form-card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 20px; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        label { font-weight: bold; display: block; margin-top: 15px; color: #34495e; }
        input { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: #3498db; color: white; border: none; border-radius: 6px; margin-top: 25px; font-size: 16px; cursor: pointer; transition: 0.3s; }
        button:hover { background: #2980b9; }
    </style>
</head>
<body>

<div class="form-card">
    <h2>Admission Form</h2>
    <form id="admissionForm">
        <label>Student Full Name</label>
        <input type="text" id="name" placeholder="Pura naam likhein" required>

        <label>Father's Name</label>
        <input type="text" id="father_name" placeholder="Pita ka naam" required>

        <label>Mobile Number</label>
        <input type="tel" id="mobile" pattern="[0-9]{10}" placeholder="10-digit number" required>

        <label>Date of Birth</label>
        <input type="date" id="dob" required>

        <button type="submit">Submit Application</button>
    </form>
</div>

<script>
    document.getElementById('admissionForm').onsubmit = async (e) => {
        e.preventDefault();
        const data = {
            name: document.getElementById('name').value,
            father: document.getElementById('father_name').value,
            mobile: document.getElementById('mobile').value,
            dob: document.getElementById('dob').value,
            timestamp: new Date().toLocaleString()
        };

        // Cloudflare Worker API call (Placeholder URL)
        const response = await fetch('/api/submit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });

        if(response.ok) {
            alert('Form successfully submit ho gaya!');
            e.target.reset();
        }
    };
</script>
</body>
</html>
